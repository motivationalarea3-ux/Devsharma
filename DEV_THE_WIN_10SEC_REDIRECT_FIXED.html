:root{--gold:#79f7ff;--gold2:#9b6cff;--bg:#07071a;--panel:rgba(18,19,25,.76)}

body{min-height:100svh;overflow-x:hidden;display:grid;place-items:center;position:relative;padding:28px 16px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.avatar-wrap:before,.avatar-wrap:after{content:"";position:absolute;inset:-9px;border:1px solid #79f7ff66;border-radius:50%;animation:ringPulse 2.7s ease-out infinite}

<script>
(() => {
 const WORKER_URL='https://dev-the-win-tracker.motivationalarea3.workers.dev';
 const FALLBACK_LINK='https://t.me/+yUFTLWQR-sI3Zjk9';
 let link=FALLBACK_LINK, left=10, userInteracted=false, linkReady=false, redirectTimer=null, subscribeSent=false;
 const timerLine=document.getElementById('timerLine');
 const joinBtn=document.getElementById('joinBtn');
 const toast=document.getElementById('toast');
 function makeVisitorId(){
   try { if(window.crypto && typeof window.crypto.randomUUID==='function') return window.crypto.randomUUID(); } catch(_) {}
   return 'v-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
 }
 const visitorId=makeVisitorId();
 async function createTrackedLink(){
   const controller=typeof AbortController==='function' ? new AbortController() : null;
   const timeout=setTimeout(()=>{if(controller) controller.abort();},10000);
   try {
     const response=await fetch(WORKER_URL+'/api/create-link',{
       method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({visitor_id:visitorId,source:'dev-the-win-landing-page',landing_page_url:window.location.href}),
       signal:controller ? controller.signal : undefined
     });
     if(!response.ok) throw new Error('Worker returned HTTP '+response.status);
     const data=await response.json();
     const generated=data.invite_url || data.invite_link || data.inviteLink || data.url || data.link || (data.result && (data.result.invite_link || data.result.invite_url || data.result.inviteLink));
     if(data.ok!==true || typeof generated!=='string' || !/^https:\/\/t\.me\//i.test(generated)) throw new Error(data.error || data.description || 'Worker response did not contain a Telegram invite link');
     link=generated; joinBtn.href=link; linkReady=true;
     timerLine.innerHTML='Tap the button above to open Telegram';
     return true;
   } catch(error) {
     console.error('Tracked invite link could not be created:',error);
     link=FALLBACK_LINK; joinBtn.href=link; linkReady=false;
     timerLine.textContent='Tracking link unavailable — tap JOIN TELEGRAM NOW to continue.';
     toast.textContent='Tracking link failed. Check Cloudflare Worker logs and CHANNEL_ID.';
     toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),5000);
     return false;
   } finally {clearTimeout(timeout);}
 }
 function startCountdown(){
   const number=document.getElementById('countdownNumber');
   timerLine.textContent='Opening Telegram in 10 seconds';
   let seconds=10;
   if(redirectTimer) clearInterval(redirectTimer);
   redirectTimer=setInterval(()=>{
     seconds--;
     if(number) number.textContent=String(Math.max(0,seconds));
     else timerLine.textContent='Opening Telegram in '+Math.max(0,seconds)+' seconds';
     if(seconds<=0){
       clearInterval(redirectTimer);
       // Use the per-visitor tracked invite if ready; otherwise let the visitor continue via the known invite.
       window.location.href=(linkReady && link) ? link : FALLBACK_LINK;
     }
   },1000);
 }

 joinBtn.addEventListener('click',(e)=>{
   e.preventDefault();
   userInteracted=true;
   if(redirectTimer){clearInterval(redirectTimer);redirectTimer=null;}
   const destination = linkReady && link ? link : FALLBACK_LINK;
   // Always allow the visitor to continue to Telegram. A fallback invite may not
   // carry per-visitor attribution; never treat this click as a Subscribe event.
   const opened = window.open(destination,'_blank','noopener,noreferrer');
   if(!opened) window.location.href = destination;
   if(timerLine) timerLine.textContent = linkReady
     ? 'Telegram opened. Membership is counted only after confirmation.'
     : 'Telegram opened. Membership tracking may be unavailable for this visit.';
 });

 // Generate a per-visitor Telegram invite, then auto-redirect after the 10-second countdown.
 createTrackedLink();
 startCountdown();

 // Subscribe is emitted only after the Worker explicitly confirms membership.
 // Requires Worker endpoint GET /api/status?visitor_id=... returning {"verified":true}.
 async function checkVerifiedMembership(){
   if(subscribeSent) return;
   try {
     const response=await fetch(WORKER_URL+'/api/status?visitor_id='+encodeURIComponent(visitorId),{
       method:'GET', mode:'cors', cache:'no-store', headers:{'Accept':'application/json'}
     });
     if(!response.ok) return;
     const data=await response.json();
     if(data && data.verified===true && !subscribeSent){
       subscribeSent=true;
       if(typeof window.fbq==='function') window.fbq('track','Subscribe',{content_name:'DEV THE WIN Telegram membership'});
       timerLine.textContent='Membership confirmed.';
     }
   } catch(error) { console.debug('Membership status is not available yet.'); }
 }
 // Poll status; no Subscribe is fired from a button click.
 setInterval(checkVerifiedMembership,5000);
 checkVerifiedMembership();

 // Lightweight cyan/violet particles; adapts to screen size.
 const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
 let w,h,dpr,particles=[];
 function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.min(65,Math.floor(w/6))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,s:Math.random()*.45+.12,a:Math.random()*.55+.15,dr:(Math.random()-.5)*.25}));}
 function draw(){ctx.clearRect(0,0,w,h);for(const p of particles){p.y-=p.s;p.x+=p.dr;if(p.y<-5){p.y=h+5;p.x=Math.random()*w;}if(p.x<-5)p.x=w+5;if(p.x>w+5)p.x=-5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(121,247,255,${p.a})`;ctx.shadowBlur=8;ctx.shadowColor='#79f7ff';ctx.fill();}requestAnimationFrame(draw);}
 resize();draw();window.addEventListener('resize',resize);
})();
